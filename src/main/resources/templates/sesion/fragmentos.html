<!-- FRAGMENTO LOGIN -->

<section th:fragment="login" class="container py-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white text-center">

            <h3 class="mb-0">

                <i class="fas fa-user me-2"></i>

                [[#{login.titulo}]]

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/sesion/login}" method="post">

                <div class="mb-3">

                    <label for="username"
                           class="form-label">

                        [[#{login.usuario}]]

                    </label>

                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           th:placeholder="#{login.placeholder.usuario}"
                           required>

                </div>

                <div class="mb-3">

                    <label for="password"
                           class="form-label">

                        [[#{login.password}]]

                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           th:placeholder="#{login.placeholder.password}"
                           required>

                </div>

                <div class="text-center">

                    <button type="submit"
                            class="btn btn-primary btn-lg">

                        <i class="fas fa-sign-in-alt me-2"></i>

                        [[#{login.iniciar}]]

                    </button>

                </div>

            </form>

        </div>

        <div class="card-footer text-center">

            <h5>
                [[#{login.noCuenta}]]
            </h5>

            <a class="btn btn-primary"
               th:href="@{/sesion/registro}">

                [[#{login.registrarse}]]

            </a>

        </div>

    </div>

</section>


<!-- FRAGMENTO REGISTRO -->

<section th:fragment="registro" class="container py-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white text-center">

            <h3 class="mb-0">
                [[#{registro.titulo}]]
            </h3>

        </div>

        <div class="card-body">

            <form class="row g-3"
                  th:action="@{/sesion/guardar}"
                  th:object="${usuario}"
                  method="post">

                <div class="col-md-6">

                    <label class="form-label">
                        [[#{registro.usuario}]]
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{username}"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        [[#{registro.password}]]
                    </label>

                    <input type="password"
                           class="form-control"
                           th:field="*{password}"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        [[#{registro.nombre}]]
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{nombre}"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        [[#{registro.apellidos}]]
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{apellidos}"
                           required>

                </div>

                <div class="col-12">

                    <label class="form-label">
                        [[#{registro.correo}]]
                    </label>

                    <input type="email"
                           class="form-control"
                           th:field="*{correo}"
                           required>

                </div>

                <div class="col-12">

                    <label class="form-label">
                        [[#{registro.telefono}]]
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{telefono}"
                           required>

                </div>

                <div class="col-12 text-center">

                    <button type="submit"
                            class="btn btn-primary btn-lg">

                        [[#{registro.registrarse}]]

                    </button>

                </div>

            </form>

        </div>

        <div class="card-footer text-center">

            <h5>
                [[#{registro.yaCuenta}]]
            </h5>

            <a class="btn btn-primary"
               th:href="@{/sesion/listado}">

                [[#{registro.iniciarSesion}]]

            </a>

        </div>

    </div>

</section>
