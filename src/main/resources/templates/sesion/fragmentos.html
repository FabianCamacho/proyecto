<!-- FRAGMENTO LOGIN -->

<section th:fragment="login" class="container py-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white text-center">

            <h3 class="mb-0">
                <i class="fas fa-user me-2"></i>
                Login
            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/sesion/login}" method="post">

                <div class="mb-3">

                    <label for="username" class="form-label">
                        Usuario
                    </label>

                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           placeholder="Ingrese su usuario"
                           required>

                </div>

                <div class="mb-3">

                    <label for="password" class="form-label">
                        Contraseña
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Ingrese su contraseña"
                           required>

                </div>

                <div class="text-center">

                    <button type="submit"
                            class="btn btn-primary btn-lg">

                        <i class="fas fa-sign-in-alt me-2"></i>
                        Iniciar Sesión

                    </button>

                </div>

            </form>

        </div>

        <div class="card-footer text-center">

            <h5>¿No tienes cuenta?</h5>

            <a class="btn btn-primary"
               th:href="@{/sesion/registro}">

                Registrarse

            </a>

        </div>

    </div>

</section>


<!-- FRAGMENTO REGISTRO -->

<section th:fragment="registro" class="container py-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white text-center">

            <h3 class="mb-0">
                Registro
            </h3>

        </div>

        <div class="card-body">

            <form class="row g-3"
                  th:action="@{/sesion/guardar}"
                  th:object="${usuario}"
                  method="post">

                <div class="col-md-6">

                    <label class="form-label">
                        Nombre de Usuario
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{username}"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Contraseña
                    </label>

                    <input type="password"
                           class="form-control"
                           th:field="*{password}"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{nombre}"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Apellidos
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{apellidos}"
                           required>

                </div>

                <div class="col-12">

                    <label class="form-label">
                        Correo
                    </label>

                    <input type="email"
                           class="form-control"
                           th:field="*{correo}"
                           required>

                </div>

                <div class="col-12">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{telefono}"
                           required>

                </div>

                <div class="col-12 text-center">

                    <button type="submit"
                            class="btn btn-primary btn-lg">

                        Registrarse

                    </button>

                </div>

            </form>

        </div>

        <div class="card-footer text-center">

            <h5>¿Ya tienes una cuenta?</h5>

            <a class="btn btn-primary"
               th:href="@{/sesion/listado}">

                Iniciar Sesión

            </a>

        </div>

    </div>

</section>
